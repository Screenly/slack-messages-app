<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Messages - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body
    class="bg-[linear-gradient(160deg,#3f0e40_0%,#4a154b_55%,#611f69_100%)] text-[#f2f2f3]"
  >
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
      class="relative z-[var(--z-index-content)]"
    >
      <div id="app" class="flex flex-col w-full h-full p-5 gap-5">
        <app-header
          class="header flex-shrink-0 rounded-xl py-2 px-5 bg-white text-[#1a1a1a] border border-[rgba(0,0,0,0.08)] [text-shadow:none] [zoom:1.4]"
          show-date
        ></app-header>

        <main class="flex-1 flex flex-col min-h-0 overflow-hidden">
          <!-- Announcement container: shown after the latest message loads -->
          <div
            id="announcement-container"
            style="display: none"
            class="flex-1 flex items-center justify-center min-h-0 overflow-hidden"
          ></div>
        </main>
      </div>
    </auto-scaler>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
