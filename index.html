<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Messages - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body class="bg-[#111] text-[#f2f2f3]">
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
      class="relative z-[var(--z-index-content)]"
    >
      <div id="app" class="flex flex-col w-full h-full p-5 gap-5">
        <app-header
          class="header flex-shrink-0 rounded-xl py-2 px-5 bg-[#1a1a1a] border border-[#2a2a2a]"
          show-date
        ></app-header>

        <main class="flex-1 flex flex-col min-h-0 overflow-hidden">
          <!-- Feed screen: shown after messages load -->
          <div
            id="feed-screen"
            style="display: none"
            class="flex-1 flex flex-col min-h-0 overflow-hidden"
          >
            <div
              id="channels-grid"
              class="grid grid-cols-[repeat(auto-fit,minmax(22rem,1fr))] portrait:grid-cols-1 gap-5 flex-1 min-h-0 overflow-auto"
            ></div>
          </div>

          <!-- Error screen -->
          <div
            id="error-screen"
            style="display: none"
            class="flex-1 flex items-center justify-center"
          >
            <div
              class="error-card bg-[#1a1a1a] border border-[rgba(255,80,80,0.2)] rounded-3xl flex flex-row portrait:flex-col overflow-hidden max-w-[60rem] portrait:max-w-full w-full"
            >
              <div
                class="error-card-left bg-[rgba(255,80,80,0.08)] border-r border-[rgba(255,80,80,0.2)] portrait:border-r-0 portrait:border-b py-10 px-8 flex flex-col justify-start gap-4 flex-[0_0_20rem] portrait:flex-none"
              >
                <h2
                  class="text-[2rem] font-bold leading-[1.2] tracking-[-0.03em] text-[#ff6b6b] m-0"
                >
                  Something went wrong
                </h2>
                <p class="text-base text-[#dadadb] leading-[1.6] m-0">
                  Slack messages could not be loaded. Please check your
                  configuration or contact your administrator.
                </p>
              </div>
              <div
                class="error-card-right flex-1 py-10 px-8 flex flex-col justify-start gap-3"
              >
                <div
                  class="error-detail-label text-xs font-semibold text-[#9d9d9f] uppercase tracking-[0.08em]"
                >
                  Error details
                </div>
                <p
                  id="error-message"
                  class="error-detail-message text-base text-[#dadadb] leading-[1.6] [word-break:break-word] m-0"
                ></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </auto-scaler>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
