version: 2

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      bun:
        patterns:
          - '*'
    ignore:
      # TypeScript 7 is the native (Go) compiler and ships no JS compiler API,
      # which typescript-eslint (used by `edge-apps-scripts lint`) requires.
      # Unpin once typescript-eslint supports TypeScript 7.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'development'
    groups:
      github-actions:
        patterns:
          - '*'
