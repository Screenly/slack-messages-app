version: 2

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      bun:
        patterns:
          - '*'
    ignore:
      # typescript-eslint (used by @screenly/edge-apps for linting) does not
      # support TypeScript 7 yet. Remove once it does.
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'development'
    groups:
      github-actions:
        patterns:
          - '*'
