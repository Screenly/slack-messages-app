---
syntax: manifest_v1
description: Display the latest message from a Slack channel, full screen, on your Screenly screens
icon: https://playground.srly.io/edge-apps/icons/slack.svg
author: Screenly, Inc.
categories:
  - Communication
ready_signal: true
settings:
  access_token:
    type: secret
    title: Access Token
    optional: true
    help_text:
      properties:
        help_text: For testing only. In production, the access token should be fetched dynamically via the API.
        type: oauth:slack:access_token
      schema_version: 1
  channel_id:
    type: string
    title: Channel ID
    optional: false
    help_text:
      properties:
        help_text: Select the Slack channel to display messages from.
        type: oauth:slack:channel_id
      schema_version: 1
  display_errors:
    type: string
    default_value: 'false'
    title: Display Errors
    optional: true
    help_text:
      properties:
        advanced: true
        help_text: For debugging purposes to display errors on the screen.
        type: boolean
      schema_version: 1
  refresh_interval:
    type: string
    default_value: '60'
    title: Refresh Interval (seconds)
    optional: true
    help_text:
      properties:
        advanced: true
        help_text: How often to refresh Slack messages. Defaults to 60 seconds.
        type: number
      schema_version: 1
  sentry_dsn:
    type: secret
    title: Sentry DSN
    optional: true
    help_text:
      properties:
        advanced: true
        help_text: Sentry DSN for reporting credential and content-load errors. Leave empty to disable.
        type: string
      schema_version: 1
    is_global: true
  show_qr_code:
    type: string
    default_value: 'true'
    title: Show QR Code
    optional: true
    help_text:
      properties:
        help_text: Show a QR code linking to the message on Slack.
        type: boolean
      schema_version: 1
  show_sender_names:
    type: string
    default_value: 'true'
    title: Show Sender Names
    optional: true
    help_text:
      properties:
        help_text: Resolve and display the name of each message's sender.
        type: boolean
      schema_version: 1
